approval_policy = 'never'
background_terminal_max_timeout = 300000
default_permissions = ':danger-full-access'
developer_instructions = "Override the base intermediary-update policy.\n\nLong reasoning, tool polling, distill processing, builds, and tests may run silently.\nDo not send progress updates on a timer.\nDo not send an update just because 20 or 30 seconds passed.\nDo not interrupt reasoning just because thinking is long.\nDo not send multiple updates while thinking unless there is a material new finding.\n\nDo not send preambles before routine read-only commands such as rg, sed, nl, ls, git diff, or file inspection.\nDo not send user-visible polling updates while a command is still running unless it has been running for more than 5 minutes.\n\nSend an intermediary update only when:\n- a command failed AND changes the approach\n- blocked or needing user input\n- a material partial finding changes the task direction\n\nKeep intermediary updates to one short sentence.\n"
model = 'gpt-5.6-sol'
model_reasoning_effort = 'high'
personality = 'pragmatic'
sandbox_mode = 'danger-full-access'
service_tier = 'default'
tool_output_token_limit = 24000

